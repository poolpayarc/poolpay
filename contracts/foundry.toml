[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Optimizer + IR pipeline: shrinks deployed bytecode (keeps PoolPay under the 24576-byte
# EIP-170 limit) and resolves "stack too deep" in the event ABI encoders.
optimizer = true
optimizer_runs = 200
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
